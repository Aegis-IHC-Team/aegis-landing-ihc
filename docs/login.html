<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AEGIS</title>
    <link rel="stylesheet" href="assets/styles/global.css">
    <link rel="stylesheet" href="assets/styles/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="assets/images/logo_aegis.png" alt="AEGIS" style="height: 60px; width: auto;">
                </div>
                <h1 class="auth-title">Bienvenido/a</h1>
                <p class="auth-subtitle">Inicia sesión para acceder a todos los nuevos métodos de práctica y simulación
                    de casos de ciberseguridad</p>
            </div>

            <div class="auth-social">
                <button class="btn-google" onclick="Utils.showToast('Funcionalidad en desarrollo', 'info')">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="btn-facebook" onclick="Utils.showToast('Funcionalidad en desarrollo', 'info')">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </button>
            </div>

            <div class="auth-divider">
                <span>o</span>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-input" id="email" name="email" placeholder="usuario@ejemplo.com"
                        required autocomplete="email">
                </div>

                <div class="form-group-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-input" id="password" name="password" placeholder="••••••••"
                        required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>

                <div class="form-checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Recordarme</span>
                    </label>
                    <a href="password-recovery.html" class="auth-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Iniciar Sesión
                </button>
            </form>

            <div class="auth-footer">
                ¿No tienes una cuenta? <a href="register.html" class="auth-link">Regístrate</a>
            </div>
        </div>
    </div>

    <script src="assets/scripts/storage-manager.js"></script>
    <script src="assets/scripts/utilities.js"></script>
    <script src="assets/scripts/auth.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('toggleIcon');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>

</html>
