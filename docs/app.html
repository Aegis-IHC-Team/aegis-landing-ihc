<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS - Simulación de Ciberseguridad</title>
    <link rel="stylesheet" href="assets/styles/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #102441 0%, #2371D7 50%, #1BC467 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated background orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #1BC467;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #1CB9B9;
            bottom: 10%;
            right: 10%;
            animation-delay: 3s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: #2371D7;
            top: 50%;
            right: 20%;
            animation-delay: 6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -30px) scale(1.1);
            }

            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            75% {
                transform: translate(20px, 30px) scale(1.05);
            }
        }

        /* Splash container */
        .splash-container {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: scaleIn 0.8s ease-out;
        }

        /* Logo shield */
        .logo-shield {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            position: relative;
            animation: pulse 2s infinite ease-in-out;
        }

        .shield-icon {
            font-size: 120px;
            color: #FFFFFF;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* Logo text */
        .logo-text {
            font-size: 4rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: fadeSlideUp 1s ease-out 0.3s both;
        }

        .logo-subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            animation: fadeSlideUp 1s ease-out 0.6s both;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading bar */
        .loading-container {
            width: 250px;
            margin: 0 auto;
            animation: fadeSlideUp 1s ease-out 0.9s both;
        }

        .loading-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #1BC467, #1CB9B9);
            border-radius: 10px;
            width: 0;
            animation: loadProgress 2.5s ease-in-out forwards;
            box-shadow: 0 0 15px rgba(27, 196, 103, 0.6);
        }

        @keyframes loadProgress {
            0% {
                width: 0;
            }

            100% {
                width: 100%;
            }
        }

        .loading-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 3rem;
            }

            .logo-shield {
                width: 100px;
                height: 100px;
            }

            .shield-icon {
                font-size: 80px;
            }
        }
    </style>
</head>

<body>
    <!-- Animated background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Splash content -->
    <div class="splash-container">
        <div class="logo-shield">
            <img src="assets/images/logo_aegis.png" alt="AEGIS"
                style="width: 150px; height: auto; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));">
        </div>

        <h1 class="logo-text">AEGIS</h1>
        <p class="logo-subtitle">Simulación de Ciberseguridad</p>

        <div class="loading-container">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <p class="loading-text">Cargando...</p>
        </div>
    </div>

    <script src="assets/scripts/storage-manager.js"></script>
    <script src="assets/scripts/utilities.js"></script>
    <script src="assets/scripts/splash.js"></script>
</body>

</html>
