<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aegis — Cambiar Contraseña</title>
  <link rel="stylesheet" href="../assets/styles/demo.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="time">Cambiar Contraseña</div>
      <div style="width:36px"></div>
    </div>

    <div class="screen active" id="changePasswordScreen">
      <h1 class="welcome-title">Cambiar Contraseña</h1>
      <p class="welcome-subtitle">Actualiza tu contraseña para mayor seguridad</p>

      <div class="input-group">
        <label style="font-size: 12px; opacity: 0.7; margin-bottom: 5px; display: block;">Contraseña Actual</label>
        <div class="input-with-icon">
          <input type="password" class="input-field" placeholder="Contraseña actual" id="currentPassword" />
          <span class="eye-icon" onclick="togglePassword('currentPassword')"><i class="fa-solid fa-eye"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label style="font-size: 12px; opacity: 0.7; margin-bottom: 5px; display: block;">Nueva Contraseña</label>
        <div class="input-with-icon">
          <input type="password" class="input-field" placeholder="Nueva contraseña" id="newPassword" />
          <span class="eye-icon" onclick="togglePassword('newPassword')"><i class="fa-solid fa-eye"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label style="font-size: 12px; opacity: 0.7; margin-bottom: 5px; display: block;">Confirmar Contraseña</label>
        <div class="input-with-icon">
          <input type="password" class="input-field" placeholder="Confirmar contraseña" id="confirmPassword" />
          <span class="eye-icon" onclick="togglePassword('confirmPassword')"><i class="fa-solid fa-eye"></i></span>
        </div>
      </div>

      <button class="primary-btn" onclick="changePassword()">Actualizar Contraseña</button>
    </div>
  </div>

  <script src="../assets/scripts/demo.js"></script>
</body>
</html>
