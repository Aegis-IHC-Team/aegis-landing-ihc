<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aegis — Configuración</title>
  <link rel="stylesheet" href="../assets/styles/demo.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="time">Configuración</div>
      <div style="width:36px"></div>
    </div>

    <div class="screen active" id="settingsScreen">
      <h1 class="welcome-title">Configuración</h1>
      <p class="welcome-subtitle">Personaliza tu experiencia en Aegis</p>

      <div style="padding: 20px; background: rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <div>
            <div style="font-weight: 600; margin-bottom: 5px;">Notificaciones</div>
            <div style="font-size: 12px; opacity: 0.7;">Recibe alertas de simulaciones</div>
          </div>
          <div class="switch-toggle">
            <input type="checkbox" id="notificationsToggle" checked />
            <label for="notificationsToggle"></label>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <div>
            <div style="font-weight: 600; margin-bottom: 5px;">Modo Oscuro</div>
            <div style="font-size: 12px; opacity: 0.7;">Activar tema oscuro</div>
          </div>
          <div class="switch-toggle">
            <input type="checkbox" id="darkModeToggle" />
            <label for="darkModeToggle"></label>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-weight: 600; margin-bottom: 5px;">Reportes por Email</div>
            <div style="font-size: 12px; opacity: 0.7;">Enviar reportes semanales</div>
          </div>
          <div class="switch-toggle">
            <input type="checkbox" id="reportsToggle" />
            <label for="reportsToggle"></label>
          </div>
        </div>
      </div>

      <div style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;">
        <button class="secondary-btn" style="width: 100%; color: #ff4444; border-color: rgba(255,68,68,0.5); margin-bottom: 10px;" onclick="if(confirm('¿Eliminar tu cuenta? Esta acción es irreversible.')) { alert('Cuenta eliminada'); }">
          <i class="fa-solid fa-trash"></i> Eliminar Cuenta
        </button>
        <button class="primary-btn" onclick="history.back()">Volver</button>
      </div>
    </div>
  </div>

  <script src="../assets/scripts/demo.js"></script>
</body>
</html>
