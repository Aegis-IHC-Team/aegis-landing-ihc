<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualización - AEGIS</title>
    <link rel="stylesheet" href="../assets/styles/global.css">
    <link rel="stylesheet" href="../assets/styles/dashboard.css">
    <link rel="stylesheet" href="../assets/styles/simulations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="dashboard-page">
    <header class="dashboard-header">
        <div class="header-container">
            <a href="../home.html" class="header-logo"><img src="../assets/images/logo_grande.png" alt="AEGIS"
                    style="height: 40px; width: auto;"></a>
            <button class="menu-toggle" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
            <nav class="header-nav" id="headerNav">
                <ul class="nav-links">
                    <li><a href="../home.html" class="nav-link">Inicio</a></li>
                    <li><a href="my-simulations.html" class="nav-link">Mis Simulaciones</a></li>
                    <li><a href="create-template.html" class="nav-link active">Crear Simulación</a></li>
                </ul>
                <div class="header-user" onclick="toggleUserDropdown()">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="User" class="user-avatar"
                        id="headerAvatar">
                    <span class="user-name" id="headerUserName">Usuario</span>
                    <i class="fas fa-chevron-down dropdown-icon"></i>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="../profile.html" class="dropdown-item"><i class="fas fa-user"></i><span>Mi
                                Perfil</span></a>
                        <a href="my-simulations.html" class="dropdown-item"><i class="fas fa-chart-line"></i><span>Mis
                                Resultados</span></a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item" onclick="event.preventDefault(); logout()"><i
                                class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="dashboard-content">
        <div class="wizard-container">
            <div class="wizard-card slide-up">
                <button class="btn-back" onclick="window.location.href='schedule.html'"
                    style="position: absolute; top: 20px; left: 20px;">
                    <i class="fas fa-arrow-left"></i>
                </button>

                <div class="wizard-header">
                    <h1 class="wizard-title">Previsualización</h1>
                    <p class="wizard-subtitle">Simulación: <strong id="simTitle"></strong></p>
                </div>

                <div class="preview-card">
                    <div class="preview-row">
                        <span class="preview-label">Plantilla:</span>
                        <span class="preview-value" id="previewTemplate">-</span>
                    </div>
                    <div class="preview-row">
                        <span class="preview-label">Dificultad:</span>
                        <span class="preview-value" id="previewDifficulty">-</span>
                    </div>
                    <div class="preview-row">
                        <span class="preview-label">Participantes:</span>
                        <span class="preview-value" id="previewParticipants">0 usuarios</span>
                    </div>
                    <div class="preview-row">
                        <span class="preview-label">Fecha de Inicio:</span>
                        <span class="preview-value" id="previewStart">-</span>
                    </div>
                    <div class="preview-row">
                        <span class="preview-label">Fecha de Finalización:</span>
                        <span class="preview-value" id="previewEnd">-</span>
                    </div>
                    <div class="preview-row">
                        <span class="preview-label">Descripción:</span>
                        <span class="preview-value" id="previewDescription">-</span>
                    </div>
                </div>

                <div class="flex gap-md mt-lg">
                    <button class="btn btn-secondary" onclick="window.location.href='schedule.html'">
                        Editar
                    </button>
                    <button class="btn btn-primary btn-full" onclick="publishSimulation()" id="publishBtn">
                        <i class="fas fa-paper-plane"></i> Publicar
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/scripts/storage-manager.js"></script>
    <script src="../assets/scripts/utilities.js"></script>
    <script src="../assets/scripts/navigation.js"></script>
    <script src="../assets/scripts/simulation-manager.js"></script>
    <script>
        Utils.redirectIfNotLoggedIn();

        const workflowState = SimulationManager.loadWorkflowState();
        if (!workflowState.template || !workflowState.name) {
            window.location.href = 'create-template.html';
        }

        const template = SimulationManager.getTemplate(workflowState.template);

        // Display preview
        document.getElementById('simTitle').textContent = workflowState.name;
        document.getElementById('previewTemplate').textContent = template.name;
        document.getElementById('previewDifficulty').textContent = Utils.capitalizeFirst(workflowState.difficulty);
        document.getElementById('previewParticipants').textContent = `${workflowState.participants.length} usuarios`;
        document.getElementById('previewStart').textContent = `${workflowState.startDate} ${workflowState.startTime}`;
        document.getElementById('previewEnd').textContent = `${workflowState.endDate} ${workflowState.endTime}`;
        document.getElementById('previewDescription').textContent = workflowState.description || '-';

        function publishSimulation() {
            const btn = document.getElementById('publishBtn');
            Utils.showLoading(btn);

            const result = SimulationManager.completeSimulation(workflowState);

            if (result.success) {
                Utils.showToast('Simulación creada exitosamente', 'success');
                setTimeout(() => {
                    window.location.href = 'my-simulations.html';
                }, 1500);
            } else {
                Utils.hideLoading(btn);
                Utils.showToast(result.message || 'Error al crear simulación', 'error');
            }
        }

        function toggleMobileMenu() { document.getElementById('headerNav').classList.toggle('show'); }
        function toggleUserDropdown() { document.getElementById('userDropdown').classList.toggle('show'); }
        function logout() {
            StorageManager.logout();
            if (typeof Utils !== 'undefined' && Utils.showToast) {
                Utils.showToast('Sesión cerrada exitosamente', 'success');
            }
            setTimeout(() => window.location.href = '../login.html', 500);
        }
    </script>
</body>

</html>
