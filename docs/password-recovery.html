<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - AEGIS</title>
    <link rel="stylesheet" href="assets/styles/global.css">
    <link rel="stylesheet" href="assets/styles/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <!-- Back button -->
    <button class="btn-back" onclick="window.location.href='login.html'">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="auth-container">
        <div class="auth-card fade-in">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="auth-title">Recupera tu contraseña</h1>
                <p class="auth-subtitle">¿Olvidaste tu contraseña? Ingresa tu correo y te enviaremos un enlace y código
                    de restablecimiento de contraseña</p>
            </div>

            <!-- Recovery form -->
            <form class="auth-form" id="recoveryForm">
                <!-- Email -->
                <div class="form-group-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-input" id="email" name="email" placeholder="usuario@ejemplo.com"
                        required autocomplete="email">
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn btn-primary btn-full">
                    Enviar correo
                </button>
            </form>

            <!-- Back to login link -->
            <div class="auth-footer">
                <a href="login.html" class="auth-link">Regresar al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script src="assets/scripts/storage-manager.js"></script>
    <script src="assets/scripts/utilities.js"></script>
    <script src="assets/scripts/auth.js"></script>
</body>

</html>
